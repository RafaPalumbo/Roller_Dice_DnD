<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Arcane Dice — D&amp;D Roller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --parchment: #F5EFE0;
    --parchment-deep: #ECE3CF;
    --parchment-shadow: #D9CDB1;
    --crimson: #B30000;
    --crimson-deep: #7A0000;
    --crimson-bright: #D11515;
    --ink: #1B1410;
    --ink-soft: #3B2D24;
    --gold: #B89455;
    --felt: #4A4540;
    --shadow: rgba(20, 12, 8, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Lora', 'Times New Roman', serif;
    background: var(--parchment);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body {
    background: radial-gradient(ellipse at center, var(--parchment) 0%, var(--parchment-deep) 70%, var(--parchment-shadow) 100%), var(--parchment);
    /* Safe areas for iOS */
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }

  /* ---------- LAYOUT FLEXBOX (NOVO) ---------- */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    position: relative;
  }

  .main-content {
    display: flex;
    flex: 1;
    overflow: hidden; /* Mantém o Canvas contido */
    position: relative;
  }

  /* ---------- HEADER / HUD ---------- */
  header.hud {
    flex-shrink: 0; /* Nunca encolher o HUD */
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-deep) 100%);
    border-bottom: 2px solid var(--crimson);
    padding: 12px 20px;
    box-shadow: 0 4px 12px var(--shadow);
    position: relative;
    z-index: 10;
    /* Adicionado limite de rolagem nativo do hud */
    max-height: 45vh; 
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  header.hud::-webkit-scrollbar { width: 4px; height: 4px;}
  header.hud::-webkit-scrollbar-thumb { background: var(--crimson-deep); border-radius: 2px; }

  header.hud::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 4px;
    background: linear-gradient(90deg, transparent 0%, var(--crimson-deep) 20%, var(--crimson) 50%, var(--crimson-deep) 80%, transparent 100%);
    opacity: 0.5;
  }

  .hud-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark { width: 36px; height: 36px; color: var(--crimson); flex-shrink: 0; }
  .brand h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.3rem; letter-spacing: 0.04em; color: var(--crimson-deep); line-height: 1; cursor: pointer; transition: color 0.3s ease; }
  .brand .tag { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }

  /* Dice selector */
  .dice-selector {
    display: flex; gap: 4px; background: var(--parchment); padding: 4px; border: 1.5px solid var(--crimson);
    border-radius: 4px; box-shadow: inset 0 0 0 1px var(--parchment-deep), 0 2px 4px var(--shadow); flex-wrap: wrap; justify-content: center;
  }

  .die-btn {
    width: 48px; height: 48px; background: var(--parchment-deep); border: 1px solid var(--crimson-deep);
    cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; font-family: 'Playfair Display', serif; font-weight: 700; color: var(--crimson-deep); position: relative;
  }

  .die-btn:hover { background: var(--crimson); color: var(--parchment); transform: translateY(-2px); box-shadow: 0 4px 8px var(--shadow); }
  .die-btn:hover svg { fill: var(--parchment); stroke: var(--parchment); }
  .die-btn:active { transform: translateY(0); }
  .die-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--crimson-deep); stroke-width: 1.5; transition: all 0.15s ease; }
  .die-btn .lbl { font-size: 0.65rem; letter-spacing: 0.06em; }

  .die-btn .count-badge {
    position: absolute; top: -6px; right: -6px; background: var(--crimson); color: var(--parchment);
    width: 18px; height: 18px; border-radius: 50%; font-size: 0.65rem; font-weight: 700; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 1px 3px var(--shadow); transform: scale(0);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; font-family: 'Lora', serif;
  }
  .die-btn .count-badge.active { transform: scale(1); }

  /* Modifier */
  .modifier-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .modifier-block label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
  .mod-input-wrap { display: flex; align-items: center; background: var(--parchment); border: 1.5px solid var(--crimson); height: 32px; }
  .mod-input-wrap button { width: 24px; height: 100%; background: var(--parchment); border: none; color: var(--crimson-deep); font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.1s; font-family: 'Lora', serif; }
  .mod-input-wrap button:hover { background: var(--crimson); color: var(--parchment); }
  .mod-input-wrap input { width: 36px; height: 100%; border: none; background: transparent; text-align: center; font-family: 'Lora', serif; font-size: 1.1rem; font-weight: 600; color: var(--ink); border-left: 1px solid var(--crimson-deep); border-right: 1px solid var(--crimson-deep); outline: none; }

  /* Action buttons */
  .actions { display: flex; gap: 8px; }
  .btn {
    font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 16px; height: 38px; border: 2px solid var(--crimson-deep); cursor: pointer; transition: all 0.15s ease;
    font-size: 0.75rem; position: relative; overflow: hidden;
  }
  .btn-primary { background: var(--crimson); color: var(--parchment); box-shadow: 0 3px 0 var(--crimson-deep), 0 4px 8px var(--shadow); }
  .btn-primary:hover:not(:disabled) { background: var(--crimson-bright); transform: translateY(-1px); box-shadow: 0 4px 0 var(--crimson-deep), 0 6px 12px var(--shadow); }
  .btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--crimson-deep), 0 2px 4px var(--shadow); }
  .btn-primary:disabled { background: var(--parchment-shadow); color: var(--ink-soft); border-color: var(--ink-soft); cursor: not-allowed; box-shadow: none; opacity: 0.6; }
  .btn-secondary { background: var(--parchment); color: var(--crimson-deep); }
  .btn-secondary:hover { background: var(--crimson-deep); color: var(--parchment); }

  /* Selection display */
  .selection-display {
    width: 100%; margin-top: 10px; padding: 6px 10px; background: var(--parchment);
    border: 1px solid var(--parchment-shadow); font-family: 'Lora', serif; font-size: 0.95rem;
    color: var(--ink-soft); min-height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; text-align: center;
  }
  .selection-display .label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--crimson-deep); }
  .selection-display .formula { font-weight: 600; color: var(--ink); font-size: 1rem; font-style: italic; }
  .selection-display .empty { font-style: italic; color: var(--ink-soft); opacity: 0.6; }

  /* ---------- CANVAS (TABLE) ---------- */
  .table-wrap { flex: 1; position: relative; overflow: hidden; background: #2a2724; }
  #canvas-container { position: absolute; inset: 0; outline: none; width: 100%; height: 100%; }
  #canvas-container canvas { display: block; outline: none; width: 100% !important; height: 100% !important;}

  /* ---------- SIDEBAR (HISTORY) ---------- */
  aside.sidebar { 
    width: 320px; flex-shrink: 0; background: var(--parchment-deep); border-left: 2px solid var(--crimson); 
    display: flex; flex-direction: column; overflow: hidden; position: relative; 
  }
  aside.sidebar::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2px; width: 2px; background: linear-gradient(180deg, transparent 0%, var(--crimson-deep) 20%, var(--crimson) 50%, var(--crimson-deep) 80%, transparent 100%); }
  .sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--parchment-shadow); text-align: center; background: var(--parchment); }
  .sidebar-header h2 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1rem; letter-spacing: 0.12em; color: var(--crimson-deep); }
  .sidebar-header .ornament { margin-top: 4px; color: var(--crimson); font-size: 0.75rem; letter-spacing: 0.5em; opacity: 0.7; }
  .history-list { list-style: none; flex: 1; overflow-y: auto; padding: 10px 14px; -webkit-overflow-scrolling: touch; }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--crimson-deep); border-radius: 2px; }
  
  .history-item { padding: 10px; background: var(--parchment); border-left: 3px solid var(--crimson); margin-bottom: 8px; font-family: 'Lora', serif; animation: slideIn 0.3s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .history-item .formula { font-size: 0.75rem; color: var(--ink-soft); font-style: italic; margin-bottom: 2px; }
  .history-item .total { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--crimson-deep); line-height: 1; }
  .history-item.crit { border-left-color: var(--crimson-bright); }
  .history-item.crit .total { color: var(--crimson-bright); text-shadow: 0 0 8px rgba(209, 21, 21, 0.4); }
  .history-item.crit::after { content: "★ CRÍTICO"; display: block; font-family: 'Playfair Display', serif; font-size: 0.55rem; letter-spacing: 0.2em; color: var(--crimson-bright); margin-top: 4px; font-weight: 900; }
  .history-item .breakdown { font-size: 0.75rem; color: var(--ink-soft); margin-top: 3px; font-family: 'Lora', serif; }
  .history-empty { padding: 20px 16px; text-align: center; color: var(--ink-soft); font-style: italic; opacity: 0.6; font-size: 0.85rem; }

  /* ---------- RESULT BANNER ---------- */
  #result-banner { position: fixed; top: 50%; left: calc(50% - 160px); transform: translate(-50%, -50%) scale(0.85); z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center; min-width: 320px; max-width: 90%; }
  #result-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner-frame { background: var(--parchment); border: 3px solid var(--crimson-deep); padding: 18px 24px 20px; box-shadow: 0 0 0 1px var(--parchment), 0 0 0 4px var(--crimson), 0 14px 32px rgba(0,0,0,0.35), inset 0 0 0 1px var(--parchment-deep); position: relative; }
  .banner-frame::before, .banner-frame::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--crimson-deep); }
  .banner-frame::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
  .banner-frame::after { bottom: -3px; right: -3px; border-left: none; border-top: none; }
  .banner-label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--crimson-deep); opacity: 0.8; }
  .banner-total { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-weight: 900; color: var(--crimson); line-height: 1; margin: 4px 0 6px; text-shadow: 0 2px 0 var(--crimson-deep), 0 4px 8px rgba(0,0,0,0.2); }
  .banner-breakdown { font-family: 'Lora', serif; font-style: italic; font-size: 0.9rem; color: var(--ink-soft); }
  .banner-crit { margin-top: 8px; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 0.85rem; letter-spacing: 0.18em; color: var(--crimson-bright); animation: pulseCrit 1.2s ease-in-out infinite; }

  /* ---------- LOADING ---------- */
  .loading { position: fixed; inset: 0; background: var(--parchment); display: flex; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 16px; transition: opacity 0.5s ease; }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .loading .text { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--crimson-deep); letter-spacing: 0.2em; }
  .loading .spinner { width: 50px; height: 50px; border: 3px solid var(--parchment-deep); border-top-color: var(--crimson); border-radius: 50%; animation: spin 0.9s linear infinite; }

  /* ================= RESPONSIVO DEFINITIVO ================= */
  
  /* Celular Vertical (Portrait) & Telas Menores */
  @media (max-width: 900px) {
    .main-content { flex-direction: column; }
    aside.sidebar { display: none; } /* Oculta a barra lateral no mobile para dar foco aos dados */
    
    .brand { margin-right: 0; width: 100%; justify-content: center; margin-bottom: 5px; }
    .hud-row { gap: 8px; padding-bottom: 4px; }
    
    .die-btn { width: 44px; height: 44px; }
    .die-btn svg { width: 16px; height: 16px; }
    
    #result-banner { left: 50%; transform: translate(-50%, -50%) scale(0.8); }
    #result-banner.show { transform: translate(-50%, -50%) scale(0.95); }
    
    /* Centralizando câmera mobile na Física */
    .table-wrap { min-height: 50vh; }
  }

  /* Celular Horizontal (Landscape) */
  @media (max-height: 500px) and (orientation: landscape) {
    header.hud { padding: 6px 10px; max-height: 50vh; }
    .brand { display: none; } /* Remove Logo para dar mais espaço */
    .selection-display { display: none; } /* Oculta display de texto para focar na mesa */
    .die-btn { width: 38px; height: 38px; }
    .btn { height: 32px; padding: 4px 12px; font-size: 0.7rem; }
    .mod-input-wrap { height: 28px; }
    #result-banner.show { transform: translate(-50%, -50%) scale(0.7); }
  }

</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text">Convocando os Dados...</div>
</div>

<div class="app">
  <header class="hud">
    <div class="hud-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M32 4 L58 18 L58 46 L32 60 L6 46 L6 18 Z" opacity="0.15"/>
          <path fill="none" stroke="currentColor" stroke-width="2.2" d="M32 4 L58 18 L58 46 L32 60 L6 46 L6 18 Z M32 4 L32 32 M58 18 L32 32 M58 46 L32 32 M32 60 L32 32 M6 46 L32 32 M6 18 L32 32"/>
        </svg>
        <div>
          <h1 id="brand-title">Arcane Dice</h1>
          <div class="tag">D&amp;D Roller · Tomo de Sortes</div>
        </div>
      </div>

      <div class="dice-selector" id="dice-selector"></div>

      <div class="modifier-block">
        <label>Modificador</label>
        <div class="mod-input-wrap">
          <button id="mod-minus">−</button>
          <input type="number" id="modifier" value="0" />
          <button id="mod-plus">+</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="roll-btn">⚔ Rolar</button>
        <button class="btn btn-secondary" id="clear-btn">Limpar</button>
      </div>
    </div>

    <div class="selection-display" id="selection-display">
      <span class="label">Convocação Atual:</span>
      <span class="formula" id="formula-text"><span class="empty">— nenhum dado selecionado —</span></span>
    </div>
  </header>

  <div class="main-content">
    <div class="table-wrap">
      <div id="canvas-container"></div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Crônica de Rolagens</h2>
        <div class="ornament">✦ ✦ ✦</div>
      </div>
      <ul class="history-list" id="history-list">
        <li class="history-empty" id="history-empty">As rolagens aparecerão aqui</li>
      </ul>
    </aside>
  </div>
</div>

<div id="result-banner">
  <div class="banner-frame">
    <div class="banner-label">Resultado</div>
    <div class="banner-total" id="banner-total">0</div>
    <div class="banner-breakdown" id="banner-breakdown"></div>
    <div class="banner-crit" id="banner-crit" style="display:none;">⚡ ACERTO CRÍTICO ⚡</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
//ARCANE DICE — Motor Físico Otimizado (Mobile Ready + Anti Z-Fighting)
   

(() => {
'use strict';

const COLORS = { parchment: 0xF5EFE0, parchmentDeep: 0xECE3CF, felt: 0x4A4540, crimson: 0xB30000, crimsonDeep: 0x7A0000, crimsonBright: 0xD11515, ink: 0x1B1410, diceFace: 0xF7F2E5 };
const PHYSICS = { gravity: -45, diceMass: 1.5, rollImpulse: 15, spinImpulse: 25, sleepThreshold: 0.1, sleepTimeLimit: 0.3, restitution: 0.3, friction: 0.6 };
const DICE_TYPES = ['d2','d4','d6','d8','d10','d12','d20','d100'];

const selection = {}; DICE_TYPES.forEach(t => selection[t] = 0);
const liveDice = []; 
let rolling = false, rollResolved = false, rollStartTime = 0, history = [], modifier = 0;

window.divineIntervention = false;
let clickCount = 0;
document.addEventListener('DOMContentLoaded', () => {
  const brandTitle = document.getElementById('brand-title');
  if(!brandTitle) return;
  brandTitle.addEventListener('click', () => {
    clickCount++;
    if (clickCount === 3) {
      window.divineIntervention = !window.divineIntervention;
      clickCount = 0;
      console.log("Destino alterado:", window.divineIntervention);
    }
    setTimeout(() => clickCount = 0, 800); 
  });
});

const container = document.getElementById('canvas-container');
let scene, camera, renderer, world, particleGroups = [];
const tableW = 28, tableH = 18;

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2724);
  scene.fog = new THREE.Fog(0x2a2724, 25, 60);

  const w = container.clientWidth, h = container.clientHeight;
  
  // Camera Adaptativa para Mobile
  const isMobile = window.innerWidth < 900;
  const fov = isMobile ? 55 : 45; // Campo de visão maior em celulares
  const camY = isMobile ? 30 : 24; // Câmera mais alta em celulares

  camera = new THREE.PerspectiveCamera(fov, w / h, 0.1, 200);
  camera.position.set(0, camY, 14);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita a 2 para não explodir bateria no mobile
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffe9c2, 0.4); scene.add(amb);
  const key = new THREE.DirectionalLight(0xfff2d6, 1.1); key.position.set(8, 18, 10); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.camera.near = 1; key.shadow.camera.far = 50; key.shadow.camera.left = -16; key.shadow.camera.right = 16; key.shadow.camera.top = 16; key.shadow.camera.bottom = -16; key.shadow.bias = -0.0008; scene.add(key);
  const fill = new THREE.DirectionalLight(0xc0a880, 0.5); fill.position.set(-12, 8, -6); scene.add(fill);
  const rim = new THREE.PointLight(0xb30000, 0.7, 30); rim.position.set(0, 4, -10); scene.add(rim);

  const tableTex = generateTableTexture();
  const tableMat = new THREE.MeshStandardMaterial({ map: tableTex, roughness: 0.95, metalness: 0.0 });
  const tableGeom = new THREE.PlaneGeometry(tableW, tableH);
  const table = new THREE.Mesh(tableGeom, tableMat);
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  const borderGeom = new THREE.BoxGeometry(tableW, 0.6, 0.4);
  const borderMat = new THREE.MeshStandardMaterial({ color: COLORS.crimsonDeep, roughness: 0.7, metalness: 0.1 });
  ['n', 's'].forEach((d) => { const m = new THREE.Mesh(borderGeom, borderMat); m.position.set(0, 0.3, d === 'n' ? -tableH/2 : tableH/2); m.castShadow = m.receiveShadow = true; scene.add(m); });
  const borderGeomY = new THREE.BoxGeometry(0.4, 0.6, tableH);
  ['e', 'w'].forEach((d) => { const m = new THREE.Mesh(borderGeomY, borderMat); m.position.set(d === 'e' ? tableW/2 : -tableW/2, 0.3, 0); m.castShadow = m.receiveShadow = true; scene.add(m); });

  world = new CANNON.World();
  world.gravity.set(0, PHYSICS.gravity, 0);
  world.broadphase = new CANNON.SAPBroadphase(world); 
  world.solver.iterations = 50; 
  world.solver.tolerance = 0.001;
  world.allowSleep = true;

  const floorMat = new CANNON.Material('floorMat'), diceMat = new CANNON.Material('diceMat');
  world.addContactMaterial(new CANNON.ContactMaterial(floorMat, diceMat, { friction: PHYSICS.friction, restitution: PHYSICS.restitution }));
  world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.3, restitution: 0.4, contactEquationStiffness: 1e8, contactEquationRelaxation: 3 }));

  const floorBody = new CANNON.Body({ mass: 0, material: floorMat });
  floorBody.addShape(new CANNON.Plane());
  floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
  world.addBody(floorBody);

  const wallShape = new CANNON.Plane();

function buildPolyhedron(verts, faces, faceValues) {
  const shapeCenter = new THREE.Vector3();
  verts.forEach(v => shapeCenter.add(new THREE.Vector3(...v)));
  shapeCenter.divideScalar(verts.length);

  const cleanFaces = faces.map(face => {
    const v0 = new THREE.Vector3(...verts[face[0]]), v1 = new THREE.Vector3(...verts[face[1]]), v2 = new THREE.Vector3(...verts[face[2]]);
    const e1 = new THREE.Vector3().subVectors(v1, v0), e2 = new THREE.Vector3().subVectors(v2, v0);
    const n = new THREE.Vector3().crossVectors(e1, e2).normalize();
    const toFace = new THREE.Vector3().subVectors(v0, shapeCenter);
    if (n.dot(toFace) < 0) return face.slice().reverse();
    return face;
  });

  const positions = [], uvs = [], indices = [], faceNormals = []; let groupStart = 0; const geom = new THREE.BufferGeometry();

  cleanFaces.forEach((face, fi) => {
    const faceVerts = face.map(idx => new THREE.Vector3(...verts[idx]));
    const e1 = new THREE.Vector3().subVectors(faceVerts[1], faceVerts[0]), e2 = new THREE.Vector3().subVectors(faceVerts[2], faceVerts[0]);

    const u_axis = e1.clone().normalize(), v_axis = new THREE.Vector3().crossVectors(n, u_axis).normalize(), center = new THREE.Vector3();

    const local2D = faceVerts.map(v => { const d = new THREE.Vector3().subVectors(v, center); return [d.dot(u_axis), d.dot(v_axis)]; });
    
    let maxDist = 0;
    local2D.forEach(([u,v]) => { const dist = Math.sqrt(u*u + v*v); if (dist > maxDist) maxDist = dist; });
    const range = maxDist * 2 || 1; 

    const baseIdx = positions.length / 3;
    faceVerts.forEach((v, vi) => {
      positions.push(v.x, v.y, v.z);
      const [u2, v2] = local2D[vi];
      uvs.push(0.5 + (u2 / range) * 0.9, 0.5 + (v2 / range) * 0.9); 
    });
    
    let triCount = 0; 
    for (let i = 1; i < face.length - 1; i++) { indices.push(baseIdx, baseIdx + i, baseIdx + i + 1); triCount += 3; }
    geom.addGroup(groupStart, triCount, fi); groupStart += triCount;

  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3)); 
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); 
  geom.setIndex(indices); 
  geom.computeVertexNormals(); 

  const cannonVerts = verts.map(v => new CANNON.Vec3(...v)), cannonFaces = cleanFaces.map(f => f.slice()), cannonShape = new CANNON.ConvexPolyhedron(cannonVerts, cannonFaces);
  return { geom, faceNormals, faceValues, cannonShape };
}

/* ---------------- ROLL LOGIC ---------------- */
function clearAllDice() { liveDice.forEach(d => d.destroy()); liveDice.length = 0; hideBanner(); }

function spawnDice() {
  const items = [];
  DICE_TYPES.forEach(t => { const count = selection[t] || 0; if (t === 'd100') { for (let i = 0; i < count; i++) { items.push({ type: 'd10tens', d100: true, role: 'tens', pairId: i }); items.push({ type: 'd10', d100: true, role: 'ones', pairId: i }); } } else { for (let i = 0; i < count; i++) items.push({ type: t }); } });
  if (items.length === 0) return false;
  items.forEach((item, idx) => {
    const die = new Die(item.type, { partOfD100: !!item.d100, d100Role: item.role }); die.partOfD100 = !!item.d100; die.d100Role = item.role || null; die.d100PairId = item.pairId;
    const cols = Math.ceil(Math.sqrt(items.length)), col = idx % cols, row = Math.floor(idx / cols), xOff = (col - (cols - 1) / 2) * 1.5 + (Math.random() - 0.5) * 0.4, zOff = (row - (cols - 1) / 2) * 1.5 + (Math.random() - 0.5) * 0.4 - 2;
    die.setPosition(xOff, 6 + Math.random() * 2, zOff); die.randomizeRotation(); die.applyRollImpulse(); liveDice.push(die);
  });
  return true;
}

function rollSelected() {
  if (rolling || !hasAnyDiceSelected()) return; clearAllDice(); rolling = true; rollResolved = false; rollStartTime = performance.now(); setRollEnabled(false);
  modifier = parseInt(document.getElementById('modifier').value || '0', 10) || 0;
  if (!spawnDice()) { rolling = false; setRollEnabled(true); }
}

function setRollEnabled(enabled) { document.getElementById('roll-btn').disabled = !enabled; }

/* ---------------- RESOLVE WHEN SETTLED ---------------- */
function tryResolveRoll() {
  if (!rolling || rollResolved || liveDice.length === 0) return;
  const allSleeping = liveDice.every(d => d.body.sleepState === CANNON.Body.SLEEPING), isTimeout = (performance.now() - rollStartTime) > 5000;
  if (!allSleeping && !isTimeout) return;
  if (isTimeout) liveDice.forEach(d => { if(d.body.sleepState !== CANNON.Body.SLEEPING) d.body.sleep(); });
  liveDice.forEach(d => d.resolve());

  let total = 0, isCrit = false; const breakdownParts = [], d100Groups = {}, standalone = [], byType = {};
  liveDice.forEach(d => { if (d.partOfD100) { if (!d100Groups[d.d100PairId]) d100Groups[d.d100PairId] = {}; d100Groups[d.d100PairId][d.d100Role] = d; } else standalone.push(d); });
  Object.keys(d100Groups).forEach(id => { const g = d100Groups[id]; if (!g.tens || !g.ones) return; let val = (g.tens.rolledValue || 0) + (g.ones.rolledValue || 0); if (val === 0) val = 100; total += val; breakdownParts.push(`d100=${val} (${g.tens.rolledValue}|${g.ones.rolledValue})`); });
  standalone.forEach(d => { if (!byType[d.type]) byType[d.type] = []; let v = d.rolledValue; if (d.type === 'd10' && v === 0) v = 10; byType[d.type].push(v); total += v; if (d.type === 'd20' && d.rolledValue === 20 && !d.critEffectSpawned) { isCrit = true; d.critEffectSpawned = true; spawnCritParticles(d.mesh.position); } });
  Object.keys(byType).forEach(t => breakdownParts.unshift(`${byType[t].length}${t}=[${byType[t].join(',')}]`));

  total += modifier; rollResolved = true; rolling = false; setRollEnabled(true);
  showBanner(total, breakdownParts.join(' + '), modifier, isCrit, byType, d100Groups); addToHistory(total, breakdownParts.join(' + '), modifier, isCrit);
}

/* ---------------- CRITICAL PARTICLES ---------------- */
function spawnCritParticles(position) {
  const count = 80, geom = new THREE.BufferGeometry(), positions = new Float32Array(count * 3), velocities = [], lifetimes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions[i*3] = position.x; positions[i*3+1] = position.y + 0.5; positions[i*3+2] = position.z;
    const theta = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI, speed = 4 + Math.random() * 6;
    velocities.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta) * speed, Math.abs(Math.cos(phi)) * speed * 1.2 + 2, Math.sin(phi) * Math.sin(theta) * speed));
    lifetimes[i] = 1.0 + Math.random() * 0.8;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xD11515, size: 0.18, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }), points = new THREE.Points(geom, mat);
  scene.add(points); particleGroups.push({ points, velocities, lifetimes, age: 0, maxAge: 1.6 });
}

function updateParticles(dt) {
  for (let i = particleGroups.length - 1; i >= 0; i--) {
    const g = particleGroups[i]; g.age += dt; const positions = g.points.geometry.attributes.position.array;
    for (let p = 0; p < g.velocities.length; p++) { positions[p*3] += g.velocities[p].x * dt; positions[p*3+1] += g.velocities[p].y * dt; positions[p*3+2] += g.velocities[p].z * dt; g.velocities[p].y -= 18 * dt; }
    g.points.geometry.attributes.position.needsUpdate = true; g.points.material.opacity = Math.max(0, 1 - (g.age / g.maxAge));
    if (g.age >= g.maxAge) { scene.remove(g.points); g.points.geometry.dispose(); g.points.material.dispose(); particleGroups.splice(i, 1); }
  }
}

/* ---------------- BANNER & HISTORY ---------------- */
function showBanner(total, breakdown, mod, isCrit, byType, d100Groups) {
  const banner = document.getElementById('result-banner'); document.getElementById('banner-total').textContent = total; const parts = [];
  Object.keys(byType).forEach(t => parts.push(`${byType[t].length}${t} [${byType[t].join(' + ')}]`));
  Object.keys(d100Groups).forEach(id => { const g = d100Groups[id]; if (g.tens && g.ones) parts.push(`d100 [${((g.tens.rolledValue + g.ones.rolledValue) === 0) ? 100 : (g.tens.rolledValue + g.ones.rolledValue)}]`); });
  let breakdownText = parts.join(' + '); if (mod !== 0) breakdownText += ` ${mod >= 0 ? '+' : ''} ${mod}`;
  document.getElementById('banner-breakdown').textContent = breakdownText; document.getElementById('banner-crit').style.display = isCrit ? 'block' : 'none';
  banner.classList.add('show'); clearTimeout(showBanner._timer); showBanner._timer = setTimeout(hideBanner, isCrit ? 5000 : 3500);
}

  const li = document.createElement('li'); li.className = 'history-item' + (isCrit ? ' crit' : '');
  const breakdownDiv = document.createElement('div'); breakdownDiv.className = 'breakdown'; breakdownDiv.textContent = breakdown + (mod !== 0 ? ` ${mod >= 0 ? '+' : ''} ${mod}` : '');

  const totalDiv = document.createElement('div'); totalDiv.className = 'total'; totalDiv.textContent = total;
  li.appendChild(formulaDiv); li.appendChild(totalDiv); li.appendChild(breakdownDiv);
  const list = document.getElementById('history-list'); list.insertBefore(li, list.firstChild);
  while (list.children.length > 30) list.removeChild(list.lastChild); history.unshift({ total, breakdown, mod, isCrit });
}

/* ---------------- UI ---------------- */
function buildDiceSelector() {
  const sel = document.getElementById('dice-selector');
  const icons = { d2: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" stroke-dasharray="2 2"/></svg>', d4: '<svg viewBox="0 0 24 24"><polygon points="12,3 21,20 3,20"/></svg>', d6: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>', d8: '<svg viewBox="0 0 24 24"><polygon points="12,3 21,12 12,21 3,12"/></svg>', d10: '<svg viewBox="0 0 24 24"><polygon points="12,3 20,10 17,21 7,21 4,10"/></svg>', d12: '<svg viewBox="0 0 24 24"><polygon points="12,3 20,9 17,19 7,19 4,9"/><polygon points="12,3 20,9 17,19 7,19 4,9" transform="rotate(36 12 12) scale(0.7) translate(5 5)" opacity="0.4"/></svg>', d20: '<svg viewBox="0 0 24 24"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="2" y2="16"/></svg>', d100:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><circle cx="16" cy="16" r="5"/><line x1="20" y1="4" x2="4" y2="20"/></svg>' };
  DICE_TYPES.forEach(t => {
    const btn = document.createElement('button'); btn.className = 'die-btn'; btn.dataset.type = t; btn.innerHTML = `${icons[t]}<span class="lbl">${t}</span><span class="count-badge" data-type="${t}">0</span>`;
    btn.addEventListener('click', () => { selection[t] = (selection[t] || 0) + 1; if (selection[t] > 20) selection[t] = 20; updateSelectionDisplay(); });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); if (selection[t] > 0) selection[t] -= 1; updateSelectionDisplay(); });
    sel.appendChild(btn);
  });
}

function updateSelectionDisplay() {
  DICE_TYPES.forEach(t => { const badge = document.querySelector(`.count-badge[data-type="${t}"]`), c = selection[t] || 0; badge.textContent = c; badge.classList.toggle('active', c > 0); });
  const formula = formulaFromSelection(), ft = document.getElementById('formula-text'); ft.innerHTML = formula ? `<span class="formula">${formula}</span>` : `<span class="empty">— nenhum dado selecionado —</span>`;
}

function formulaFromSelection() {
  const parts = []; DICE_TYPES.forEach(t => { if ((selection[t] || 0) > 0) parts.push(`${selection[t]}${t}`); });
  let f = parts.join(' + '); const mod = parseInt(document.getElementById('modifier').value || '0', 10) || 0;
  if (mod !== 0 && f) f += ` ${mod >= 0 ? '+' : '-'} ${Math.abs(mod)}`; return f;
}

function hasAnyDiceSelected() { return DICE_TYPES.some(t => (selection[t] || 0) > 0); }

function setupUI() {
  buildDiceSelector();
  document.getElementById('roll-btn').addEventListener('click', rollSelected);
  document.getElementById('clear-btn').addEventListener('click', () => { DICE_TYPES.forEach(t => selection[t] = 0); document.getElementById('modifier').value = 0; updateSelectionDisplay(); clearAllDice(); });
  document.getElementById('mod-plus').addEventListener('click', () => { const inp = document.getElementById('modifier'); inp.value = (parseInt(inp.value || '0', 10) || 0) + 1; updateSelectionDisplay(); });
  document.getElementById('mod-minus').addEventListener('click', () => { const inp = document.getElementById('modifier'); inp.value = (parseInt(inp.value || '0', 10) || 0) - 1; updateSelectionDisplay(); });
  document.getElementById('modifier').addEventListener('input', updateSelectionDisplay);
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); rollSelected(); } if (e.code === 'Escape') clearAllDice(); });
}

/* ---------------- ANIMATION LOOP ---------------- */
const clock = new THREE.Clock();
function animate() { requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 1/30); world.step(1/60, dt, 3); liveDice.forEach(d => d.syncMesh()); tryResolveRoll(); updateParticles(dt); renderer.render(scene, camera); }

/* ---------------- BOOT ---------------- */
function boot() { initScene(); setupUI(); updateSelectionDisplay(); animate(); setTimeout(() => { document.getElementById('loading').classList.add('hidden'); }, 400); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
